<html lang="en">

    <title>Contact Alyanna ♡</title>

            text-align: center;
            padding: 45px 20px;
            color: white;

        main {

            margin: 35px auto;
        }

        section {

        }

        }

        form {

            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

            border: none;
            border-radius: 10px;
            background-color: #c66f82;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
